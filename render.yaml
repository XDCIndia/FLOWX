services:
  # PostgreSQL Database
  - type: postgresql
    name: flowx-db
    plan: free
    databaseName: flowx
    ipAllowList: []

  # Redis Cache
  - type: redis
    name: flowx-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Backend API
  - type: web
    name: flowx-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowx-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: flowx-redis
          property: connectionString
      - key: PORT
        value: 3000
      - key: XDC_TREASURY_SECRET_KEY
        sync: false
      - key: XDC_RPC_URL
        value: https://rpc.apothem.network
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true

  # Frontend (Static Site)
  - type: static_site
    name: flowx-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/.next
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://flowx-api.onrender.com
